services:
  - type: web
    name: minesafe-portal
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "true"
      - key: JWT_SECRET
        generateValue: true
